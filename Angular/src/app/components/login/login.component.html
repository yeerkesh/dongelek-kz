<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🚗</div>
    <h2>{{ 'auth.loginTitle' | t }}</h2>
    <p class="auth-subtitle">Дөңгелек.kz — {{ 'home.title' | t }}</p>

    @if (errorMessage) {
      <div class="error-banner">⚠️ {{ errorMessage }}</div>
    }

    <div class="form-group">
      <label>{{ 'auth.username' | t }}</label>
      <input type="text" [(ngModel)]="username" [placeholder]="'auth.usernamePh' | t"
             class="form-control" (keyup.enter)="login()" />
    </div>

    <div class="form-group">
      <label>{{ 'auth.password' | t }}</label>
      <input type="password" [(ngModel)]="password" [placeholder]="'auth.passwordPh' | t"
             class="form-control" (keyup.enter)="login()" />
    </div>

    <button (click)="login()" [disabled]="isLoading" class="btn-submit">
      {{ (isLoading ? 'auth.loggingIn' : 'auth.loginBtn') | t }}
    </button>

    <p class="auth-switch">{{ 'auth.noAccount' | t }} <a routerLink="/register">{{ 'auth.signUp' | t }}</a></p>
  </div>
</div>
