<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🚗</div>
    <h2>Вход в аккаунт</h2>
    <p class="auth-subtitle">дөңгелек.қз — авто объявления Казахстана</p>

    @if (errorMessage) {
      <div class="error-banner">⚠️ {{ errorMessage }}</div>
    }

    <div class="form-group">
      <label>Логин</label>
      <input type="text" [(ngModel)]="username" placeholder="Введите логин"
             class="form-control" (keyup.enter)="login()" />
    </div>

    <div class="form-group">
      <label>Пароль</label>
      <input type="password" [(ngModel)]="password" placeholder="Введите пароль"
             class="form-control" (keyup.enter)="login()" />
    </div>

    <button (click)="login()" [disabled]="isLoading" class="btn-submit">
      {{ isLoading ? 'Вход...' : 'Войти' }}
    </button>

    <p class="auth-switch">Нет аккаунта? <a routerLink="/register">Зарегистрироваться</a></p>
  </div>
</div>
