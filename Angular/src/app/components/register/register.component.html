<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🚗</div>
    <h2>Регистрация</h2>
    <p class="auth-subtitle">Создайте аккаунт и размещайте объявления</p>

    @if (errorMessage) {
      <div class="error-banner">⚠️ {{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="success-banner">✅ {{ successMessage }}</div>
    }

    <div class="form-group">
      <label>Логин *</label>
      <input type="text" [(ngModel)]="username" placeholder="Придумайте логин" class="form-control" />
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" [(ngModel)]="email" placeholder="your@email.com" class="form-control" />
    </div>
    <div class="form-group">
      <label>Пароль *</label>
      <input type="password" [(ngModel)]="password" placeholder="Минимум 8 символов" class="form-control" />
    </div>
    <div class="form-group">
      <label>Подтвердите пароль *</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Повторите пароль"
             class="form-control" (keyup.enter)="register()" />
      @if (confirmPassword && password !== confirmPassword) {
        <p class="hint-error">Пароли не совпадают</p>
      }
    </div>

    <button (click)="register()" [disabled]="!isValid() || isLoading" class="btn-submit">
      {{ isLoading ? 'Создание...' : 'Зарегистрироваться' }}
    </button>
    <p class="auth-switch">Уже есть аккаунт? <a routerLink="/login">Войти</a></p>
  </div>
</div>
