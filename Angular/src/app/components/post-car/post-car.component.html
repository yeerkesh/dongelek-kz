<div class="post-car-page">
  <div class="form-card">
    <h2>{{ isEditMode ? '✏️ Редактировать' : '🚗 Подать объявление' }}</h2>

    @if (errorMessage) { <div class="error-banner">⚠️ {{ errorMessage }}</div> }
    @if (successMessage) { <div class="success-banner">✅ {{ successMessage }}</div> }

    <div class="form-group">
      <label>Заголовок *</label>
      <input type="text" [(ngModel)]="title" placeholder="Toyota Camry 2020..." class="form-control" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Марка *</label>
        <select [(ngModel)]="brand" class="form-control">
          <option value="">Выберите марку</option>
          @for (b of brands; track b.id) {
            <option [value]="b.id">{{ b.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Год *</label>
        <input type="number" [(ngModel)]="year" placeholder="2020" class="form-control" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Цена (₸) *</label>
        <input type="number" [(ngModel)]="price" placeholder="5000000" class="form-control" />
      </div>
      <div class="form-group">
        <label>Пробег (км) *</label>
        <input type="number" [(ngModel)]="mileage" placeholder="80000" class="form-control" />
      </div>
    </div>

    <div class="form-group">
      <label>Описание *</label>
      <textarea [(ngModel)]="description" rows="4" class="form-control"
                placeholder="Опишите состояние авто..."></textarea>
    </div>

    <div class="form-group">
      <label>Ссылка на фото (URL)</label>
      <input type="url" [(ngModel)]="imageUrl" placeholder="https://..." class="form-control" />
      @if (imageUrl) {
        <div class="image-preview"><img [src]="imageUrl" alt="Preview" /></div>
      }
    </div>

    <div class="form-group checkbox-group">
      <label><input type="checkbox" [(ngModel)]="isActive" /> Объявление активно</label>
    </div>

    <div class="form-actions">
      <a routerLink="/my-cars" class="btn-cancel">Отмена</a>
      <button (click)="submit()" [disabled]="!isFormValid() || isSubmitting" class="btn-submit">
        {{ isSubmitting ? 'Сохранение...' : (isEditMode ? 'Сохранить' : 'Опубликовать') }}
      </button>
    </div>
  </div>
</div>
